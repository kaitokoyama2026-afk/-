<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パリの南の写真館 | Official Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Serif JP', serif; background-color: #f8f7f2; color: #2c2c2c; margin: 0; padding: 0; line-height: 1.8; }
    header { padding: 80px 20px 40px; background: linear-gradient(to bottom, #ede9df, #f8f7f2); text-align: center; }
    h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; letter-spacing: 0.15em; margin: 0; color: #5d534a; }
    .subtitle { font-size: 0.9rem; letter-spacing: 0.3em; color: #9a8f83; margin-top: 10px; text-transform: uppercase; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
    .photo-frame { display: inline-block; padding: 15px; background-color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin-bottom: 50px; }
    img { max-width: 100%; height: auto; display: block; }
    .info-section { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 40px 0; }
    .info-card, .calendar-box { background-color: white; border: 1px solid #e2ddd3; padding: 20px 30px; min-width: 280px; box-sizing: border-box; }
    .simple-calendar { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
    .simple-calendar th { color: #9a8f83; font-weight: normal; }
    .simple-calendar td { padding: 5px; border: 1px solid #fcfaf2; }
    .contact-section { margin-top: 80px; padding: 60px 20px; border-top: 1px double #e2ddd3; background-color: #f3f0e8; text-align: center; }
    .btn { display: inline-block; padding: 20px 50px; background-color: #5d534a; color: #fff; text-decoration: none; letter-spacing: 0.2em; transition: 0.3s; font-weight: bold; }
    .btn:hover { background-color: #8b4513; transform: translateY(-3px); }
    footer { padding: 40px; font-size: 0.8rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>パリの南の写真館</h1>
    <div class="subtitle">Studio du Sud de Paris</div>
  </header>
  <div class="container">
    <div class="photo-frame">
      <img src="photo.jpg" alt="Gallery Work" width="600">
    </div>
    <p>パリの光と影を切り取る、小さな写真館へようこそ。</p>
    <div class="info-section">
      <div class="info-card">
        <h3>Information</h3>
        <p><strong>OPEN</strong> : 10:00 - 18:00</p>
        <p><strong>CLOSED</strong> : Sunday / Monday</p>
      </div>
      <div class="calendar-box">
        <h3>Schedule</h3>
        <table class="simple-calendar">
          <thead><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr></thead>
          <tbody>
            <tr><td></td><td></td><td></td><td>1</td><td>2</td><td>3</td><td>4</td></tr>
            <tr><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="contact-section">
    <h3>Contact</h3>
    <p>ご予約や撮影のご相談は、以下のボタンよりお気軽にお送りください。</p>
    <br>
    <a href="#" class="btn">お問い合わせフォームを開く</a>
  </div>
  <footer>&copy; 2026 パリの南の写真館</footer>
</body>
</html>
