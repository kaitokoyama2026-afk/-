<!DOCTYPE html>
<html lang="ja">
<head>

      line-height: 1.8;
    }

    header {

      background: linear-gradient(to bottom, #ede9df, #f8f7f2);
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;

      letter-spacing: 0.15em;

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .photo-frame {
      display: inline-block;
      padding: 15px;
      background-color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 50px;
    }

    img {

    }

    }

    .info-card, .calendar-box {

      border: 1px solid #e2ddd3;
      padding: 20px 30px;
      min-width: 280px;
      box-sizing: border-box;
    }

    .simple-calendar {
      width: 100%;
      border-collapse: collapse;

      margin-top: 10px;
    }

    .simple-calendar td { padding: 5px; border: 1px solid #fcfaf2; }
    .calendar-note { font-size: 0.7rem; color: #9a8f83; margin-top: 10px; }

    .contact-section {
      margin-top: 80px;
      padding: 60px 20px;
      border-top: 1px double #e2ddd3;
      background-color: #f3f0e8;
    }

      background-color: #5d534a;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.2em;
      transition: 0.3s;
      font-weight: bold;
    }
