<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パリの南の写真館 | Official Site</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Serif JP', serif;
      background-color: #f8f7f2;
      color: #2c2c2c;
      margin: 0;
      padding: 0;
      line-height: 1.8;
      /* opacity: 0; を削除して、最初から見えるようにしました */
    }

    header {
      padding: 80px 20px 40px;
      background: linear-gradient(to bottom, #ede9df, #f8f7f2);
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      letter-spacing: 0.15em;
      margin: 0;
      color: #5d534a;
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      color: #9a8f83;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    .photo-frame {
      display: inline-block;
      padding: 15px;
      background-color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      margin-bottom: 50px;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .description {
      font-size: 1.2rem;
      margin-bottom: 60px;
    }

    .info-card {
      background-color: white;
      border: 1px solid #e2ddd3;
      display: inline-block;
      padding: 30px 60px;
      margin-bottom: 60px;
    }

    .btn {
      display: inline-block;
      padding: 20px 50px;
      background-color: #5d534a;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.2em;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #8b4513;
    }

    footer {
      padding: 40px;
      font-size: 0.8rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>パリの南の写真館</h1>
    <div class="subtitle">Studio du Sud de Paris</div>
  </header>

  <div class="container">
    <div class="photo-frame">
      <img src="photo.jpg" alt="Gallery Work" width="600">
    </div>
